# The pull-request gate: checks the rules file and runs the repository's unit tests.
#
# On every pull request it runs, in order:
#   1. the JSON Schema check (scripts/check_schema.py),
#   2. the checksum check (scripts/seal.py --check),
#   3. the full validation rules (scripts/validate.py), including "no published rule set
#      changed" against the copy of the file on the base branch,
#   4. the unit tests, which also run every sample file in tests/valid and tests/invalid.
# Steps 1-3 are skipped, with a notice, while v1/game-rules.json does not exist yet. Once it
# exists on the base branch, a pull request that deletes it fails.
#
# This workflow runs the pull request's OWN copy of scripts/, schema/ and tests/. That is
# unavoidable (it is how a change to them gets tested) but it means a pull request could
# weaken its own checks. So read any change to scripts/, schema/, tests/ or .github/ before
# merging it (see README.md).
#
# Security notes for a public repo:
#   * `pull_request`, never `pull_request_target`, so a fork's code runs without access to
#     secrets or a write token. (Settings > Actions also makes outside contributors' runs
#     wait for approval.)
#   * The token is read-only, and checkout does not keep it around.
#   * Actions are pinned to full commit SHAs (the comment names the version), so a moved
#     tag cannot change what runs.
#
# The job's name, "Validate", is what the "Updates to main" ruleset lists as the required
# status check. Renaming the job breaks that requirement until the ruleset is updated.
name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pull request as it would be after merging (GitHub's merge commit).
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base branch's tip, in ./base, only so its copy of the rules file can be compared
      # with the pull request's. Its scripts are never run.
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      # The schema tests skip themselves when jsonschema is missing; fail loudly
      # here instead, so CI can never pass with them silently skipped.
      - name: Check jsonschema is installed
        run: python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      # Decides which of the rules-file steps below apply. `present` says whether the pull
      # request has the file; `base_present` says whether the base branch has it.
      - name: Find the rules file
        id: rules
        run: |
          set -eu
          present=false
          base_present=false
          if [ -f v1/game-rules.json ]; then present=true; fi
          if [ -f base/v1/game-rules.json ]; then base_present=true; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "base_present=$base_present" >> "$GITHUB_OUTPUT"
          if [ "$present" = false ] && [ "$base_present" = true ]; then
            echo "::error::v1/game-rules.json exists on the base branch but is missing from this pull request."
            exit 1
          fi
          if [ "$present" = false ]; then
            echo "::notice::v1/game-rules.json does not exist yet, so the rules-file checks are skipped."
          fi

      - name: Check the rules file against the JSON Schema
        if: steps.rules.outputs.present == 'true'
        run: python scripts/check_schema.py v1/game-rules.json

      - name: Check the checksum
        if: steps.rules.outputs.present == 'true'
        run: python scripts/seal.py --check v1/game-rules.json

      # With a base copy, validate.py also rejects a pull request that changes or removes a
      # rule set already published on the base branch.
      - name: Validate the rules
        if: steps.rules.outputs.present == 'true'
        run: |
          set -eu
          if [ "${{ steps.rules.outputs.base_present }}" = true ]; then
            python scripts/validate.py v1/game-rules.json --base base/v1/game-rules.json
          else
            python scripts/validate.py v1/game-rules.json
          fi

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
