# Runs the repository's unit tests on every pull request.
#
# This is the first, minimal workflow: it runs the seal and schema tests. The full
# validation workflow (validate.py against the rules file, the checksum check on
# v1/game-rules.json, the "no published rule set changed" comparison) comes with
# the CI issue and will extend or replace this one.
#
# Security notes for a public repo:
#   * `pull_request`, never `pull_request_target`, so a fork's code runs without
#     access to secrets or a write token.
#   * The token is read-only, and checkout does not keep it around.
#   * Actions are pinned to full commit SHAs (the comment names the version), so a
#     moved tag cannot change what runs.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      # The schema tests skip themselves when jsonschema is missing; fail loudly
      # here instead, so CI can never pass with them silently skipped.
      - name: Check jsonschema is installed
        run: python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
